version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      docker:
        patterns: ["*"]
    # The interpreter and uv are deliberately pinned to the versions in
    # .mise.toml; a Dockerfile bump must be a reviewed change, not a PR.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
