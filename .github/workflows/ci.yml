name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format, lint, security and pin checks
        run: make check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: make test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose interpolation
        env:
          KOKORO_VERSION: v0.0.0-ci
          KOKORO_FASTAPI_API_KEY: ci-placeholder
        run: |
          docker compose config >/dev/null
          docker compose -f compose.yml -f compose.prod.yml config >/dev/null

      - name: Build the gateway image
        run: docker build -t kokoro-tone:ci .

      - name: Smoke test the image
        run: docker run --rm kokoro-tone:ci python -c "import kokoro_tone, kokoro_tone.context, kokoro_tone.main, kokoro_tone.pipeline; print(kokoro_tone.__version__, 'imports ok')"

      # SARIF is built with every severity so code scanning sees the full
      # picture. The action drops the severity filter in this mode, so the
      # HIGH/CRITICAL gate is a separate step below.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kokoro-tone:ci
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kokoro-tone:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/kokoro_tone/__init__.py)
          echo "tag=$tag version=$version"
          if [[ -z $version || $tag != "$version" ]]; then
            echo "tag and __version__ disagree" >&2
            exit 1
          fi
