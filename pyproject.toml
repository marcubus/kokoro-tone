[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-tone"
description = "Script-first TTS gateway for Kokoro-FastAPI: pronunciation, heteronyms, normalisation, and an experimental prosody layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx2>=2.16.0",
  "pydantic>=2.7",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/kokoro_tone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_tone"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Documentation carries illustrative snippets, not modules to lint or format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
